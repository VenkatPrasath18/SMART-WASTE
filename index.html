<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Waste Collection Scheduler</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Smart Waste Scheduler</div>
  <nav>
    <a href="index.html" class="active">Dashboard</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main>
  <h1>Collection dashboard</h1>
  <p class="subtitle">Live pickup schedule by zone, and a place to report missed collections.</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Zones covered</div>
      <div class="value" id="zoneCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Active schedules</div>
      <div class="value" id="scheduleCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Reports logged</div>
      <div class="value" id="reportCount">0</div>
    </div>
  </div>

  <section class="section">
    <div class="section-header">
      <h2>Zone schedule</h2>
      <select id="zoneFilter"></select>
    </div>
    <div id="scheduleList"></div>
  </section>

  <section class="section">
    <h2>Report a missed pickup</h2>
    <form id="reportForm" class="report-form">
      <input type="text" id="reportZone" placeholder="Zone (e.g. A)" maxlength="3" />
      <input type="text" id="reportNote" placeholder="What happened?" maxlength="120" />
      <button type="submit">Submit report</button>
    </form>
    <p class="error-text" id="reportError"></p>
  </section>

  <section class="section">
    <h2>Recent reports</h2>
    <div id="reportsList"></div>
  </section>
</main>

<footer>Smart Waste Collection Scheduler &mdash; college mini project</footer>

<script src="app.js"></script>
<script>document.addEventListener("DOMContentLoaded", initDashboard);</script>
</body>
</html>
