<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin &mdash; Smart Waste Collection Scheduler</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Smart Waste Scheduler</div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="admin.html" class="active">Admin</a>
  </nav>
</header>

<main>
  <h1>Manage schedules</h1>
  <p class="subtitle">Add, edit, or remove pickup schedules. Changes appear on the dashboard instantly.</p>

  <section class="section">
    <h2 id="formHeading">Add schedule</h2>
    <form id="addForm">
      <div class="admin-form">
        <input type="text" id="newZone" placeholder="Zone (e.g. A)" maxlength="3" />
        <input type="text" id="newArea" placeholder="Area name" maxlength="60" />
        <select id="newType">
          <option value="Organic">Organic</option>
          <option value="Recyclable">Recyclable</option>
          <option value="Hazardous">Hazardous</option>
        </select>
        <input type="text" id="newDays" placeholder="Days (e.g. Mon, Wed, Fri)" maxlength="40" />
        <input type="time" id="newTime" />
      </div>
      <button type="submit" id="addSubmitBtn">Add schedule</button>
      <p class="error-text" id="addError"></p>
    </form>
  </section>

  <section class="section">
    <h2>All schedules</h2>
    <div id="adminTable"></div>
  </section>
</main>

<footer>Smart Waste Collection Scheduler &mdash; college mini project</footer>

<script src="app.js"></script>
<script>document.addEventListener("DOMContentLoaded", initAdmin);</script>
</body>
</html>
